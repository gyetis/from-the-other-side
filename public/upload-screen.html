<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="From the Other Side - recording paranormal sightings"
        />
        <link rel="stylesheet" href="styles/mainStyles.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Frijole&family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <title>From the Other Side: Upload</title>
    </head>

    <body>
        <header>
            <div data-navigation></div>
        </header>

        <main class="form-container" aria-labelledby="form-title">
            <h1 class="form-title" id="form-title">Add Sighting</h1>
            <form id="eventForm">
                <!-- Title Field -->
                <label for="title" class="lab-title">Title:</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="A ghostly encounter"
                    class="input-title"
                />

                <!-- Textarea Field -->
                <label for="details" class="lab-details">Details:</label>
                <textarea
                    id="details"
                    name="details"
                    rows="5"
                    placeholder="I was trying to get to sleep when..."
                    class="input-details"
                ></textarea>
                <!-- Time/Date Field -->
                <label for="datetime" class="lab-date-time">Time/Date:</label>
                <input
                    type="datetime-local"
                    id="datetime"
                    name="datetime"
                    class="input-date-time"
                />
                <!-- Location Field -->
                <label for="location" class="lab-location">Location:</label>
                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="London, UK"
                    class="input-location"
                />

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">submit</button>
                <div class="form-message">
                    <p class="form-message-text">
                        All sightings will be published on our
                        <a href="./story-screen.html">sightings</a> page.
                    </p>
                </div>
            </form>
        </main>

        <footer>
            <p>&copy; From The Other Side. All rights reserved.</p>
        </footer>

        <script type="module" src="./navigation.js"></script>
        <script type="module" src="upload-screen.js"></script>
    </body>
</html>
